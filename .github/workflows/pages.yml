name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh xStocks catalog
        run: npm run refresh-data:catalog-only

      - name: Refresh Solana pool liquidity
        run: npm run refresh-liquidity

      - name: Refresh xStocks catalog and visible quotes
        run: npm run refresh-data:visible

      - name: Validate refreshed data
        run: npm run check

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/assets.js data/liquidity.js _site/data/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
